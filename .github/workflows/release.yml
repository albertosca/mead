name: Release

# Pushing a tag such as v0.2.0 publishes that version to Hex and creates the GitHub release.
# The tag must equal the version in mix.exs and point at a commit that is on main.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: The Hex key is configured
        run: |
          if [ -z "$HEX_API_KEY" ]; then
            echo "the HEX_API_KEY repository secret is not set" >&2
            exit 1
          fi
      - name: The tag matches mix.exs
        run: scripts/check_release.sh "$GITHUB_REF_NAME"
      - name: The tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20"
      - run: mix deps.get
      - name: Tests with the coverage gate
        run: mix test --cover
        env:
          MIX_ENV: test
      - name: Format and warnings
        run: |
          mix format --check-formatted
          mix compile --warnings-as-errors --force
      - name: Publish the package and its docs to Hex
        run: mix hex.publish --yes
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags="--generate-notes --verify-tag"
          case "$GITHUB_REF_NAME" in *-*) flags="$flags --prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" $flags
