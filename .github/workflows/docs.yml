name: Docs

# Builds the bilingual site on every change; deploys it to GitHub Pages only when the
# repository variable DOCS_DEPLOY is "true". Set it after enabling Pages once in the
# repository settings with the "GitHub Actions" source (needs a public repository or a paid plan).
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'guide/**'
      - 'zensical.*.yml'
      - 'scripts/build_docs.sh'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Build
        run: bash scripts/build_docs.sh
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && vars.DOCS_DEPLOY == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
