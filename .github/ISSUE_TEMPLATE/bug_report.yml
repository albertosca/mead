name: Bug report
description: Something behaves differently from what the documentation says
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The smallest sequence of calls or configuration that shows it. Never paste a token or an API key.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Elixir and Erlang/OTP versions
      placeholder: "Elixir 1.20, OTP 29"
    validations:
      required: true
